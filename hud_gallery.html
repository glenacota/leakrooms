<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEAKROOMS — HUD Gallery</title>
<style>
/* ============================================================
   PALETTE — five yellows from src/config/palette.js
   ============================================================ */
:root {
  --yl-1: #b8a028;   /* deep mustard (darkest) */
  --yl-2: #c9b23a;   /* mid-dark gold */
  --yl-3: #d4be4a;   /* true backrooms yellow */
  --yl-4: #e0cc5c;   /* pale yellow */
  --yl-5: #ece070;   /* near-cream lightest */
  --ink: #1a1408;
  --danger: #c0392b;
  --phos: #33ff66;
  --water: #2a5a7a;
  --hud-bg: rgba(15, 12, 4, 0.82);
  --hud-border: rgba(212, 190, 74, 0.35);
  --hud-text: #d4be4a;
  --hud-dim: #8a7a3a;
  --font-mono: "Courier New", ui-monospace, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font-mono); }

#game-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}

/* ============================================================
   TOOLBAR
   ============================================================ */
#toolbar {
  position: fixed; top: 14px; left: 14px; z-index: 100;
  background: var(--hud-bg);
  border: 1px solid var(--hud-border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--hud-text);
  font-size: 11px;
  backdrop-filter: blur(4px);
  transition: opacity 0.25s;
  user-select: none;
  max-width: 340px;
}
#toolbar.hidden-ui { opacity: 0; pointer-events: none; }

#toolbar h3 {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--hud-dim); margin-bottom: 8px;
}
#toolbar .row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
#toolbar .row:last-child { margin-bottom: 0; }

#toolbar button {
  background: rgba(212, 190, 74, 0.08);
  border: 1px solid var(--hud-border);
  color: var(--hud-text);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
#toolbar button:hover { background: rgba(212, 190, 74, 0.2); }
#toolbar button.active {
  background: var(--yl-3); color: var(--ink); font-weight: bold;
}
#toolbar .shot-btn {
  border-color: var(--danger); color: var(--danger);
  background: rgba(192, 57, 43, 0.08);
}
#toolbar .shot-btn:hover { background: rgba(192, 57, 43, 0.2); color: #fff; }
#toolbar .shot-btn.on { background: var(--danger); color: #fff; }

/* ============================================================
   SIDE PANEL (sliders)
   ============================================================ */
#side-panel {
  position: fixed; top: 14px; right: 14px; z-index: 100;
  background: var(--hud-bg);
  border: 1px solid var(--hud-border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--hud-text);
  font-size: 10px;
  backdrop-filter: blur(4px);
  transition: opacity 0.25s;
  user-select: none;
  width: 200px;
}
#side-panel.hidden-ui { opacity: 0; pointer-events: none; }
#side-panel h4 {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--hud-dim); margin-bottom: 10px;
}
#side-panel label { display: block; margin-bottom: 10px; }
#side-panel label span { display: block; margin-bottom: 3px; }
#side-panel input[type="range"] {
  width: 100%; accent-color: var(--yl-3); cursor: pointer;
}

/* ============================================================
   ACTIVE LABEL
   ============================================================ */
#active-label {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  z-index: 100; color: var(--hud-text); font-size: 11px;
  background: var(--hud-bg); padding: 6px 16px; border-radius: 4px;
  border: 1px solid var(--hud-border);
  letter-spacing: 1px;
  transition: opacity 0.25s;
  pointer-events: none;
  user-select: none;
}
#active-label.hidden-ui { opacity: 0; }

/* ============================================================
   HUD OVERLAY LAYERS
   ============================================================ */
.hud-layer { position: fixed; z-index: 50; pointer-events: none; }
.hud-layer * { pointer-events: none; }

/* ---- Concept 1: Diegetic ---- */
#hud-1a { bottom: 0; left: 0; width: 100%; height: 100%; }
#hud-1b { top: 0; left: 0; width: 100%; height: 100%; }
#hud-1c { top: 0; left: 0; width: 100%; height: 100%; }

/* ---- Concept 2: Retro-Analog ---- */
#hud-2a { top: 50%; left: 50%; transform: translate(-50%, -50%); }
#hud-2b { top: 0; left: 0; width: 100%; }
#hud-2c { top: 0; right: 0; }

/* ---- Concept 3: Overlay ---- */
#hud-3a { top: 0; left: 0; width: 100%; height: 100%; }
#hud-3b { bottom: 0; left: 50%; transform: translateX(-50%); }
#hud-3c { top: 0; left: 0; width: 100%; height: 100%; }

/* ---- Concept 4: Vignette ---- */
#hud-4a { top: 0; left: 0; width: 100%; height: 100%; }
#hud-4b { top: 0; left: 0; width: 100%; height: 100%; }
#hud-4c { top: 0; left: 0; width: 100%; height: 100%; }

.hidden { display: none !important; }

/* ============================================================
   CRT / SCANLINES (2A)
   ============================================================ */
.crt-frame {
  width: 420px; height: 320px;
  background: #0a0a04;
  border: 14px solid #1a1a10;
  border-radius: 16px;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}
.crt-screen {
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, #0a1a0a 0%, #020802 100%);
  position: relative;
}
.crt-scanlines {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 3px
  );
  z-index: 2;
}
.crt-glass {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.06) 0%, transparent 50%);
  z-index: 3;
}
#scope-canvas { position: absolute; top: 0; left: 0; z-index: 1; }

/* ============================================================
   BOILER DASHBOARD (2B)
   ============================================================ */
#hud-2b {
  width: 100%; padding: 12px 24px;
  background: linear-gradient(180deg, #1a1408 0%, #2a2210 60%, #1a1408 100%);
  border-bottom: 3px solid #3a3220;
  display: flex; align-items: center; gap: 24px;
  flex-wrap: wrap;
}
.dial-box {
  text-align: center;
}
.dial-box canvas { display: block; }
.dial-label { font-size: 9px; color: var(--hud-dim); letter-spacing: 1px; margin-top: 4px; text-transform: uppercase; }
.lamp-row { display: flex; gap: 8px; }
.lamp {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #3a3220;
  background: #1a1a0a;
  transition: background 0.1s;
}
.lamp.on { background: var(--yl-3); box-shadow: 0 0 8px var(--yl-3); }
.lamp.warn.on { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.knob-row { display: flex; gap: 12px; }
.knob {
  width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #4a4030, #1a1408);
  border: 2px solid #3a3220;
  position: relative;
}
.knob::after {
  content: ''; position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
  width: 3px; height: 8px; background: var(--yl-4); border-radius: 1px;
}

/* ============================================================
   SONAR (2C)
   ============================================================ */
#hud-2c canvas { display: block; }

/* ============================================================
   BLUEPRINT (3A)
   ============================================================ */
#blueprint-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* ============================================================
   CLIPBOARD (3B)
   ============================================================ */
#clipboard {
  background: #1a2010;
  border: 3px solid #3a4030;
  border-radius: 4px 4px 0 0;
  padding: 10px 14px;
  width: 320px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
}
#clipboard .clip-header {
  font-size: 9px; letter-spacing: 2px; color: #7a9a4a;
  text-transform: uppercase; margin-bottom: 6px;
  border-bottom: 1px solid #3a4030; padding-bottom: 4px;
}
#clipboard canvas { display: block; }

/* ============================================================
   VIGNETTE EFFECTS (4A, 4B, 4C)
   ============================================================ */
#hud-4a .condensation {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
#hud-4a .rust-corner {
  position: absolute; width: 120px; height: 120px;
  pointer-events: none;
}
#hud-4b .mold {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
#hud-4c .warp-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* Tool wheel for 1B */
#tool-wheel {
  position: absolute; display: none;
  width: 160px; height: 160px;
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- ============ TOOLBAR ============ -->
<div id="toolbar">
  <h3>HUD Gallery — LEAKROOMS</h3>
  <div class="row" id="concept-tabs">
    <button data-concept="1" class="active">1 Diegetic</button>
    <button data-concept="2">2 Retro-Analog</button>
    <button data-concept="3">3 Blueprint</button>
    <button data-concept="4">4 Vignette</button>
  </div>
  <div class="row" id="var-tabs">
    <button data-var="a" class="active">A</button>
    <button data-var="b">B</button>
    <button data-var="c">C</button>
  </div>
  <div class="row">
    <button class="shot-btn" id="shot-toggle">Hide UI (H)</button>
  </div>
</div>

<!-- ============ SIDE PANEL ============ -->
<div id="side-panel">
  <h4>State Simulators</h4>
  <label>
    <span>Noise <span id="noise-val">50</span>%</span>
    <input type="range" id="noise-slider" min="0" max="100" value="50">
  </label>
  <label>
    <span>Flood / Battery <span id="flood-val">30</span>%</span>
    <input type="range" id="flood-slider" min="0" max="100" value="30">
  </label>
  <label>
    <span>Pressure <span id="pressure-val">20</span>%</span>
    <input type="range" id="pressure-slider" min="0" max="100" value="20">
  </label>
</div>

<!-- ============ ACTIVE LABEL ============ -->
<div id="active-label">Concept 1A — Belt Pressure Valve</div>

<!-- ============ CONCEPT 1: DIEGETIC ============ -->
<div id="hud-1a" class="hud-layer hidden">
  <canvas id="belt-canvas"></canvas>
</div>

<div id="hud-1b" class="hud-layer hidden">
  <canvas id="backpack-canvas"></canvas>
  <canvas id="tool-wheel"></canvas>
</div>

<div id="hud-1c" class="hud-layer hidden">
  <canvas id="wear-canvas"></canvas>
</div>

<!-- ============ CONCEPT 2: RETRO-ANALOG ============ -->
<div id="hud-2a" class="hud-layer hidden">
  <div class="crt-frame">
    <div class="crt-screen">
      <canvas id="scope-canvas"></canvas>
      <div class="crt-scanlines"></div>
      <div class="crt-glass"></div>
    </div>
  </div>
</div>

<div id="hud-2b" class="hud-layer hidden">
  <div class="dial-box">
    <canvas id="dial-1" width="80" height="80"></canvas>
    <div class="dial-label">Pressure</div>
  </div>
  <div class="dial-box">
    <canvas id="dial-2" width="80" height="80"></canvas>
    <div class="dial-label">Temp</div>
  </div>
  <div class="dial-box">
    <canvas id="dial-3" width="80" height="80"></canvas>
    <div class="dial-label">Battery</div>
  </div>
  <div class="lamp-row">
    <div class="lamp on" id="lamp-1"></div>
    <div class="lamp warn" id="lamp-2"></div>
    <div class="lamp" id="lamp-3"></div>
    <div class="lamp warn" id="lamp-4"></div>
    <div class="lamp" id="lamp-5"></div>
    <div class="lamp warn" id="lamp-6"></div>
  </div>
  <div class="knob-row">
    <div class="knob" id="knob-1"></div>
    <div class="knob" id="knob-2"></div>
    <div class="knob" id="knob-3"></div>
  </div>
</div>

<div id="hud-2c" class="hud-layer hidden">
  <canvas id="sonar-canvas" width="280" height="280"></canvas>
</div>

<!-- ============ CONCEPT 3: BLUEPRINT ============ -->
<div id="hud-3a" class="hud-layer hidden">
  <canvas id="blueprint-canvas"></canvas>
</div>

<div id="hud-3b" class="hud-layer hidden">
  <div id="clipboard">
    <div class="clip-header">PIPE MAINTENANCE CLIPBOARD v2.1</div>
    <canvas id="clip-canvas" width="292" height="120"></canvas>
  </div>
</div>

<div id="hud-3c" class="hud-layer hidden">
  <canvas id="sketch-canvas"></canvas>
</div>

<!-- ============ CONCEPT 4: VIGNETTE ============ -->
<div id="hud-4a" class="hud-layer hidden">
  <canvas id="condensation-canvas"></canvas>
</div>

<div id="hud-4b" class="hud-layer hidden">
  <canvas id="mold-canvas"></canvas>
</div>

<div id="hud-4c" class="hud-layer hidden">
  <canvas id="warp-canvas"></canvas>
</div>

<script>
"use strict";

// ============================================================
// STATE
// ============================================================
const state = {
  concept: 1,
  var: 'a',
  noise: 0.5,
  flood: 0.3,
  pressure: 0.2,
  hiddenUI: false,
};

// ============================================================
// CANVAS SETUP
// ============================================================
const gameCanvas = document.getElementById('game-canvas');
const gctx = gameCanvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  gameCanvas.width = window.innerWidth * dpr;
  gameCanvas.height = window.innerHeight * dpr;
  gameCanvas.style.width = window.innerWidth + 'px';
  gameCanvas.style.height = window.innerHeight + 'px';
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
// GAMEPLAY SIMULATION
// ============================================================
const PAL = ['#b8a028', '#c9b23a', '#d4be4a', '#e0cc5c', '#ece070'];
const INK = '#1a1408';

let simTime = 0;
let player = { x: 0, y: 0, angle: 0 };
let creature = { x: 0, y: 0, angle: 0, glowPhase: 0 };
let puddles = [];
let particles = [];

// Grid
const TILE = 36;
let gridW = 0, gridH = 0;

function initSim() {
  gridW = Math.ceil(window.innerWidth / TILE);
  gridH = Math.ceil(window.innerHeight / TILE);
  player.x = window.innerWidth * 0.4;
  player.y = window.innerHeight * 0.5;
  creature.x = window.innerWidth * 0.85;
  creature.y = window.innerHeight * 0.15;

  puddles = [];
  const rng = mulberry32(42);
  for (let i = 0; i < 8; i++) {
    puddles.push({
      x: rng() * window.innerWidth,
      y: rng() * window.innerHeight,
      r: 18 + rng() * 30,
      phase: rng() * Math.PI * 2,
    });
  }
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

window.addEventListener('resize', initSim);
initSim();

// Track mouse for player aim
let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

function drawBackground() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  // Floor
  gctx.fillStyle = PAL[1];
  gctx.fillRect(0, 0, w, h);

  // Tile grid
  for (let gy = 0; gy < gridH; gy++) {
    for (let gx = 0; gx < gridW; gx++) {
      const shade = (gx + gy) % 2 === 0 ? PAL[2] : PAL[1];
      gctx.fillStyle = shade;
      gctx.fillRect(gx * TILE, gy * TILE, TILE, TILE);
      // Tile texture lines
      gctx.strokeStyle = 'rgba(0,0,0,0.06)';
      gctx.strokeRect(gx * TILE, gy * TILE, TILE, TILE);
    }
  }

  // Wallpapered walls (border)
  gctx.fillStyle = PAL[0];
  gctx.fillRect(0, 0, w, TILE);
  gctx.fillRect(0, h - TILE, w, TILE);
  gctx.fillRect(0, 0, TILE, h);
  gctx.fillRect(w - TILE, 0, TILE, h);

  // Wallpaper pattern (vertical stripes)
  gctx.fillStyle = PAL[1];
  for (let x = 0; x < w; x += 24) {
    gctx.fillRect(x, 0, 2, TILE);
    gctx.fillRect(x, h - TILE, 2, TILE);
  }
  for (let y = 0; y < h; y += 24) {
    gctx.fillRect(0, y, TILE, 2);
    gctx.fillRect(w - TILE, y, TILE, 2);
  }

  // Baseboards
  gctx.fillStyle = PAL[0];
  gctx.fillRect(0, TILE - 4, w, 4);
  gctx.fillRect(0, h - TILE, w, 4);
  gctx.fillRect(TILE - 4, 0, 4, h);
  gctx.fillRect(w - TILE, 0, 4, h);

  // Pipes along walls
  drawPipes(w, h);

  // Puddles
  for (const p of puddles) {
    const shimmer = 0.3 + 0.15 * Math.sin(simTime * 0.02 + p.phase);
    gctx.fillStyle = `rgba(42, 90, 122, ${shimmer})`;
    gctx.beginPath();
    gctx.ellipse(p.x, p.y, p.r, p.r * 0.6, 0, 0, Math.PI * 2);
    gctx.fill();
    gctx.fillStyle = `rgba(100, 160, 200, ${shimmer * 0.4})`;
    gctx.beginPath();
    gctx.ellipse(p.x, p.y, p.r * 0.4, p.r * 0.25, 0, 0, Math.PI * 2);
    gctx.fill();
  }

  // Particles (dust motes)
  updateParticles();
  for (const pt of particles) {
    gctx.fillStyle = `rgba(236, 224, 112, ${pt.alpha})`;
    gctx.beginPath();
    gctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    gctx.fill();
  }
}

function drawPipes(w, h) {
  gctx.lineWidth = 6;
  gctx.lineCap = 'round';

  // Top wall pipe
  gctx.strokeStyle = '#6a6040';
  gctx.beginPath();
  gctx.moveTo(TILE, TILE * 0.5);
  gctx.lineTo(w - TILE, TILE * 0.5);
  gctx.stroke();
  gctx.strokeStyle = '#7a7050';
  gctx.lineWidth = 3;
  gctx.beginPath();
  gctx.moveTo(TILE, TILE * 0.5 - 1);
  gctx.lineTo(w - TILE, TILE * 0.5 - 1);
  gctx.stroke();

  // Bottom wall pipe
  gctx.lineWidth = 6;
  gctx.strokeStyle = '#6a6040';
  gctx.beginPath();
  gctx.moveTo(TILE, h - TILE * 0.5);
  gctx.lineTo(w - TILE, h - TILE * 0.5);
  gctx.stroke();

  // Vertical pipes
  gctx.lineWidth = 6;
  gctx.strokeStyle = '#6a6040';
  gctx.beginPath();
  gctx.moveTo(TILE * 0.5, TILE);
  gctx.lineTo(TILE * 0.5, h - TILE);
  gctx.stroke();
  gctx.beginPath();
  gctx.moveTo(w - TILE * 0.5, TILE);
  gctx.lineTo(w - TILE * 0.5, h - TILE);
  gctx.stroke();

  // Pipe joints
  gctx.fillStyle = '#5a5030';
  const joints = [
    [TILE * 0.5, TILE * 0.5],
    [w - TILE * 0.5, TILE * 0.5],
    [TILE * 0.5, h - TILE * 0.5],
    [w - TILE * 0.5, h - TILE * 0.5],
  ];
  for (const [jx, jy] of joints) {
    gctx.beginPath();
    gctx.arc(jx, jy, 6, 0, Math.PI * 2);
    gctx.fill();
  }
}

function updateParticles() {
  // Spawn dust
  if (particles.length < 40 && Math.random() < 0.3) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: 0.5 + Math.random() * 1.5,
      alpha: 0.1 + Math.random() * 0.2,
      life: 200 + Math.random() * 300,
    });
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawPlayer() {
  const px = player.x;
  const py = player.y;
  player.angle = Math.atan2(mouseY - py, mouseX - px);

  gctx.save();
  gctx.translate(px, py);
  gctx.rotate(player.angle);

  // Shadow
  gctx.fillStyle = 'rgba(0,0,0,0.3)';
  gctx.beginPath();
  gctx.ellipse(2, 3, 14, 10, 0, 0, Math.PI * 2);
  gctx.fill();

  // Body (overalls)
  gctx.fillStyle = '#3a5a8a';
  gctx.beginPath();
  gctx.ellipse(0, 0, 12, 9, 0, 0, Math.PI * 2);
  gctx.fill();

  // Shirt
  gctx.fillStyle = PAL[3];
  gctx.beginPath();
  gctx.ellipse(-2, 0, 8, 7, 0, 0, Math.PI * 2);
  gctx.fill();

  // Head
  gctx.fillStyle = '#c4a060';
  gctx.beginPath();
  gctx.arc(-3, 0, 5, 0, Math.PI * 2);
  gctx.fill();

  // Cap
  gctx.fillStyle = PAL[1];
  gctx.beginPath();
  gctx.arc(-3, 0, 5.5, Math.PI * 0.6, Math.PI * 1.4);
  gctx.fill();

  // Arm with wrench
  gctx.strokeStyle = '#c4a060';
  gctx.lineWidth = 3;
  gctx.beginPath();
  gctx.moveTo(4, 4);
  gctx.lineTo(10, 7);
  gctx.stroke();

  // Wrench
  gctx.strokeStyle = '#888';
  gctx.lineWidth = 2.5;
  gctx.beginPath();
  gctx.moveTo(10, 7);
  gctx.lineTo(15, 10);
  gctx.stroke();
  gctx.fillStyle = '#aaa';
  gctx.beginPath();
  gctx.arc(15.5, 10.5, 2.5, 0, Math.PI * 2);
  gctx.fill();

  // Legs
  gctx.strokeStyle = '#2a3a5a';
  gctx.lineWidth = 3;
  gctx.beginPath();
  gctx.moveTo(-4, -6);
  gctx.lineTo(-8, -10);
  gctx.stroke();
  gctx.beginPath();
  gctx.moveTo(-4, 6);
  gctx.lineTo(-8, 10);
  gctx.stroke();

  gctx.restore();
}

function drawFlashlight() {
  const px = player.x;
  const py = player.y;
  const angle = player.angle;
  const range = 220;
  const spread = 0.5;

  gctx.save();
  gctx.globalCompositeOperation = 'multiply';

  // Darkness
  gctx.fillStyle = 'rgba(5, 3, 0, 0.75)';
  gctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  // Flashlight cone
  gctx.globalCompositeOperation = 'destination-out';
  const grad = gctx.createRadialGradient(px, py, 10, px, py, range);
  grad.addColorStop(0, 'rgba(0,0,0,0.9)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.5)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  gctx.fillStyle = grad;
  gctx.beginPath();
  gctx.moveTo(px, py);
  gctx.arc(px, py, range, angle - spread, angle + spread);
  gctx.closePath();
  gctx.fill();

  // Center glow
  gctx.globalCompositeOperation = 'source-over';
  const glow = gctx.createRadialGradient(px, py, 0, px, py, 80);
  glow.addColorStop(0, 'rgba(236, 224, 112, 0.12)');
  glow.addColorStop(1, 'rgba(236, 224, 112, 0)');
  gctx.fillStyle = glow;
  gctx.fillRect(px - 80, py - 80, 160, 160);

  gctx.restore();
}

function drawCreature() {
  const cx = creature.x;
  const cy = creature.y;

  // Slowly drift
  creature.x += Math.sin(simTime * 0.003) * 0.3;
  creature.y += Math.cos(simTime * 0.004) * 0.2;

  // Glow eye
  creature.glowPhase += 0.02;
  const glowIntensity = 0.3 + 0.2 * Math.sin(creature.glowPhase);

  gctx.save();

  // Shadow body
  gctx.fillStyle = 'rgba(10, 5, 0, 0.7)';
  gctx.beginPath();
  gctx.ellipse(cx, cy, 18, 28, Math.sin(simTime * 0.005) * 0.2, 0, Math.PI * 2);
  gctx.fill();

  // Tendrils
  gctx.strokeStyle = 'rgba(15, 8, 0, 0.5)';
  gctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + simTime * 0.003;
    gctx.beginPath();
    gctx.moveTo(cx, cy);
    const tx = cx + Math.cos(a) * (20 + 5 * Math.sin(simTime * 0.01 + i));
    const ty = cy + Math.sin(a) * (25 + 5 * Math.cos(simTime * 0.01 + i));
    gctx.quadraticCurveTo(
      cx + Math.cos(a + 0.3) * 15, cy + Math.sin(a + 0.3) * 18,
      tx, ty
    );
    gctx.stroke();
  }

  // Red eye
  gctx.fillStyle = `rgba(180, 30, 20, ${glowIntensity})`;
  gctx.beginPath();
  gctx.arc(cx + 5, cy - 8, 3, 0, Math.PI * 2);
  gctx.fill();
  // Eye glow
  gctx.fillStyle = `rgba(200, 40, 25, ${glowIntensity * 0.3})`;
  gctx.beginPath();
  gctx.arc(cx + 5, cy - 8, 7, 0, Math.PI * 2);
  gctx.fill();

  gctx.restore();
}

const beltCanvas = document.getElementById('belt-canvas');
const bctx = beltCanvas.getContext('2d');

function drawBeltHUD() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (beltCanvas.width !== w * (window.devicePixelRatio || 1)) {
    beltCanvas.width = w * (window.devicePixelRatio || 1);
    beltCanvas.height = h * (window.devicePixelRatio || 1);
    beltCanvas.style.width = w + 'px';
    beltCanvas.style.height = h + 'px';
  }
  bctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  bctx.clearRect(0, 0, w, h);

  // Position gauge near player
  const gx = player.x + 20;
  const gy = player.y - 30;

  bctx.save();
  bctx.translate(gx, gy);

  // Gauge body
  bctx.fillStyle = '#2a2210';
  bctx.strokeStyle = '#6a6040';
  bctx.lineWidth = 2;
  bctx.beginPath();
  bctx.arc(0, 0, 18, 0, Math.PI * 2);
  bctx.fill();
  bctx.stroke();

  // Gauge face
  bctx.fillStyle = '#ece070';
  bctx.beginPath();
  bctx.arc(0, 0, 14, 0, Math.PI * 2);
  bctx.fill();

  // Ticks
  bctx.strokeStyle = INK;
  bctx.lineWidth = 1.5;
  for (let i = 0; i <= 8; i++) {
    const a = Math.PI * 0.75 + (i / 8) * Math.PI * 1.5;
    bctx.beginPath();
    bctx.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
    bctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13);
    bctx.stroke();
  }

  // Needle
  const pressure = state.flood * 0.7 + state.pressure * 0.3;
  const needleAngle = Math.PI * 0.75 + pressure * Math.PI * 1.5;
  const needleColor = pressure < 0.4 ? '#3a8a3a' : pressure < 0.7 ? '#d4be4a' : '#c0392b';
  bctx.strokeStyle = needleColor;
  bctx.lineWidth = 2;
  bctx.beginPath();
  bctx.moveTo(0, 0);
  bctx.lineTo(Math.cos(needleAngle) * 11, Math.sin(needleAngle) * 11);
  bctx.stroke();

  // Center dot
  bctx.fillStyle = INK;
  bctx.beginPath();
  bctx.arc(0, 0, 2, 0, Math.PI * 2);
  bctx.fill();

  // Label
  bctx.fillStyle = '#d4be4a';
  bctx.font = '7px Courier New';
  bctx.textAlign = 'center';
  bctx.fillText('PSI', 0, 28);

  bctx.restore();

  // Steam puffs when pressure high
  if (pressure > 0.5 && Math.random() < (pressure - 0.5) * 0.6) {
    // Steam particles near valve
    for (let i = 0; i < 3; i++) {
      bctx.fillStyle = `rgba(200, 200, 200, ${0.3 + Math.random() * 0.3})`;
      bctx.beginPath();
      bctx.arc(
        gx + (Math.random() - 0.5) * 8,
        gy - 15 - Math.random() * 10,
        2 + Math.random() * 4,
        0, Math.PI * 2
      );
      bctx.fill();
    }
  }
}

const backpackCanvas = document.getElementById('backpack-canvas');

let wheelVisible = false;

function drawBackpackHUD() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  if (backpackCanvas.width !== w * dpr) {
    backpackCanvas.width = w * dpr;
    backpackCanvas.height = h * dpr;
    backpackCanvas.style.width = w + 'px';
    backpackCanvas.style.height = h + 'px';
  }
  bpctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bpctx.clearRect(0, 0, w, h);

  // Backpack position behind player
  const bx = player.x - Math.cos(player.angle) * 18;
  const by = player.y - Math.sin(player.angle) * 18;

  // Backpack body
  bpctx.fillStyle = '#4a3a20';
  bpctx.strokeStyle = '#6a5a30';
  bpctx.lineWidth = 2;
  bpctx.beginPath();
  bpctx.roundRect(bx - 10, by - 8, 20, 16, 4);
  bpctx.fill();
  bpctx.stroke();

  // LED ring status
  const status = state.noise > 0.6 ? 'warn' : state.noise > 0.35 ? 'caution' : 'ok';
  const ledColor = status === 'ok' ? '#33ff66' : status === 'caution' ? '#ffcc33' : '#ff3333';
  const pulseSpeed = status === 'ok' ? 0.02 : status === 'caution' ? 0.05 : 0.1;
  const pulse = 0.6 + 0.4 * Math.sin(simTime * pulseSpeed);

  bpctx.strokeStyle = ledColor;
  bpctx.lineWidth = 2.5;
  bpctx.globalAlpha = pulse;
  bpctx.shadowColor = ledColor;
  bpctx.shadowBlur = 8;
  bpctx.beginPath();
  bpctx.arc(bx, by, 13, 0, Math.PI * 2);
  bpctx.stroke();
  bpctx.shadowBlur = 0;
  bpctx.globalAlpha = 1;

  // Tools on backpack
  bpctx.fillStyle = '#888';
  bpctx.fillRect(bx - 2, by - 12, 4, 4);
  bpctx.fillStyle = '#666';
  bpctx.fillRect(bx + 3, by - 12, 3, 5);

  // Tool wheel (shows on hold/key)
  if (wheelVisible) {
    drawToolWheel(bx, by - 30);
  }
}

function drawToolWheel(cx, cy) {
  toolWheel.style.display = 'block';
  toolWheel.style.left = (cx - 80) + 'px';
  toolWheel.style.top = (cy - 80) + 'px';
  const dpr = window.devicePixelRatio || 1;
  toolWheel.width = 160 * dpr;
  toolWheel.height = 160 * dpr;
  twctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  twctx.clearRect(0, 0, 160, 160);

  const tools = ['Wrench', 'Sealant', 'Gauge', 'Torch'];
  const colors = ['#33ff66', '#ffcc33', '#33aaff', '#ff6633'];
  const selIdx = 0;

  for (let i = 0; i < 4; i++) {
    const a0 = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const a1 = ((i + 1) / 4) * Math.PI * 2 - Math.PI / 2;
    const mid = (a0 + a1) / 2;

    twctx.fillStyle = i === selIdx ? colors[i] + '44' : 'rgba(20,15,5,0.7)';
    twctx.strokeStyle = colors[i];
    twctx.lineWidth = 2;
    twctx.beginPath();
    twctx.arc(80, 80, 55, a0, a1);
    twctx.arc(80, 80, 30, a1, a0, true);
    twctx.closePath();
    twctx.fill();
    twctx.stroke();

    // Label
    twctx.fillStyle = colors[i];
    twctx.font = '8px Courier New';
    twctx.textAlign = 'center';
    twctx.fillText(tools[i], 80 + Math.cos(mid) * 42, 80 + Math.sin(mid) * 42 + 3);
  }

  // Center
  twctx.fillStyle = '#1a1408';
  twctx.beginPath();
  twctx.arc(80, 80, 28, 0, Math.PI * 2);
  twctx.fill();
  twctx.strokeStyle = '#d4be4a';
  twctx.lineWidth = 1.5;
  twctx.stroke();
}

// HUD: CONCEPT 2A — Oscilloscope
// ============================================================
const scopeCanvas = document.getElementById('scope-canvas');
const sctx = scopeCanvas.getContext('2d');

function initScope() {
  const rect = scopeCanvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  scopeCanvas.width = rect.width * dpr;
  scopeCanvas.height = rect.height * dpr;
  scopeCanvas.style.width = rect.width + 'px';
  scopeCanvas.style.height = rect.height + 'px';
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawScope() {
  const w = parseFloat(scopeCanvas.style.width);
  const h = parseFloat(scopeCanvas.style.height);
  sctx.clearRect(0, 0, w, h);

  const mid = h / 2;
  const amp = h * 0.35;

  // Grid
  sctx.strokeStyle = 'rgba(51, 255, 102, 0.1)';
  sctx.lineWidth = 0.5;
  for (let x = 0; x < w; x += 20) {
    sctx.beginPath(); sctx.moveTo(x, 0); sctx.lineTo(x, h); sctx.stroke();
  }
  for (let y = 0; y < h; y += 20) {
    sctx.beginPath(); sctx.moveTo(0, y); sctx.lineTo(w, y); sctx.stroke();
  }

  // Waveform
  sctx.strokeStyle = '#33ff66';
  sctx.lineWidth = 1.5;
  sctx.shadowColor = '#33ff66';
  sctx.shadowBlur = 3;
  sctx.beginPath();
  for (let x = 0; x < w; x++) {
    const t = x / w * Math.PI * 6 + simTime * 0.04;
    const base = Math.sin(t) * amp * 0.3 * state.noise;
    const leak = Math.sin(t * 3.7) * amp * 0.2 * state.flood;
    const spike = (Math.random() < state.noise * 0.02) ? (Math.random() - 0.5) * amp * 2 : 0;
    const y = mid + base + leak + spike;
    x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
  }
  sctx.stroke();
  sctx.shadowBlur = 0;

  // Creature noise spikes (red)
  sctx.strokeStyle = 'rgba(255, 50, 50, 0.6)';
  sctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    if (Math.random() < state.noise * 0.1) {
      const sx = Math.random() * w;
      sctx.beginPath();
      sctx.moveTo(sx, mid);
      sctx.lineTo(sx + (Math.random() - 0.5) * 10, mid + (Math.random() - 0.5) * amp * 2);
      sctx.stroke();
    }
  }
}

// HUD: CONCEPT 2B — Boiler Dashboard
// ============================================================
const dials = [
  document.getElementById('dial-1').getContext('2d'),
  document.getElementById('dial-2').getContext('2d'),
  document.getElementById('dial-3').getContext('2d'),
];

function drawDial(ctx, value, label) {
  const s = 80;
  ctx.clearRect(0, 0, s, s);
  const cx = s / 2, cy = s / 2, r = 32;

  // Face
  ctx.fillStyle = '#ece070';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3a3220';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Ticks
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI * 0.75 + (i / 10) * Math.PI * 1.5;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * (r - 6), cy + Math.sin(a) * (r - 6));
    ctx.lineTo(cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2));
    ctx.stroke();
  }

  // Needle
  const na = Math.PI * 0.75 + value * Math.PI * 1.5;
  ctx.strokeStyle = value > 0.75 ? '#c0392b' : INK;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(na) * (r - 8), cy + Math.sin(na) * (r - 8));
  ctx.stroke();

  // Center
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawBoiler() {
  drawDial(dials[0], state.flood * 0.8 + state.pressure * 0.2, 'PSI');
  drawDial(dials[1], state.pressure, 'Temp');
  drawDial(dials[2], 1 - state.flood * 0.5, 'Batt');

  // Lamps
  const lamps = ['lamp-1', 'lamp-2', 'lamp-3', 'lamp-4', 'lamp-5', 'lamp-6'];
  lamps.forEach((id, i) => {
    const el = document.getElementById(id);
    const on = Math.random() < state.noise * (0.3 + i * 0.1);
    el.classList.toggle('on', on);
  });

  // Knob rotation
  for (let i = 1; i <= 3; i++) {
    const knob = document.getElementById('knob-' + i);
    const rot = (state.noise * 120 + i * 40) % 360;
    knob.style.transform = `rotate(${rot}deg)`;
  }
}

// HUD: CONCEPT 2C — Sonar
// ============================================================
const sonarCanvas = document.getElementById('sonar-canvas');
const rctx = sonarCanvas.getContext('2d');
let sweepAngle = 0;

function drawSonar() {
  const s = 280;
  const cx = s / 2, cy = s / 2, r = s / 2 - 10;
  rctx.clearRect(0, 0, s, s);

  // Background
  rctx.fillStyle = '#0a0a04';
  rctx.beginPath();
  rctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
  rctx.fill();

  // Range rings
  rctx.strokeStyle = 'rgba(51, 255, 102, 0.2)';
  rctx.lineWidth = 0.5;
  for (let i = 1; i <= 4; i++) {
    rctx.beginPath();
    rctx.arc(cx, cy, r * i / 4, 0, Math.PI * 2);
    rctx.stroke();
  }

  // Cross
  rctx.beginPath();
  rctx.moveTo(cx - r, cy); rctx.lineTo(cx + r, cy);
  rctx.moveTo(cx, cy - r); rctx.lineTo(cx, cy + r);
  rctx.stroke();

  // Sweep
  sweepAngle += 0.02 * (1 + state.noise);
  const grad = rctx.createConicGradient
    ? (() => {
        const g = rctx.createConicGradient(sweepAngle, cx, cy);
        g.addColorStop(0, 'rgba(51, 255, 102, 0.4)');
        g.addColorStop(0.1, 'rgba(51, 255, 102, 0)');
        g.addColorStop(1, 'rgba(51, 255, 102, 0)');
        return g;
      })()
    : 'rgba(51, 255, 102, 0.1)';
  rctx.fillStyle = grad;
  rctx.beginPath();
  rctx.moveTo(cx, cy);
  rctx.arc(cx, cy, r, 0, Math.PI * 2);
  rctx.fill();

  // Sweep line
  rctx.strokeStyle = '#33ff66';
  rctx.lineWidth = 1.5;
  rctx.beginPath();
  rctx.moveTo(cx, cy);
  rctx.lineTo(cx + Math.cos(sweepAngle) * r, cy + Math.sin(sweepAngle) * r);
  rctx.stroke();

  // Leak pings (yellow)
  const leakCount = Math.floor(state.flood * 5);
  for (let i = 0; i < leakCount; i++) {
    const a = (i * 2.4 + 1) % (Math.PI * 2);
    const d = 30 + (i * 17) % (r - 40);
    const lx = cx + Math.cos(a) * d;
    const ly = cy + Math.sin(a) * d;
    const pingAlpha = 0.4 + 0.3 * Math.sin(simTime * 0.05 + i);
    rctx.fillStyle = `rgba(236, 224, 112, ${pingAlpha})`;
    rctx.beginPath();
    rctx.arc(lx, ly, 4, 0, Math.PI * 2);
    rctx.fill();
    rctx.strokeStyle = `rgba(236, 224, 112, ${pingAlpha * 0.5})`;
    rctx.lineWidth = 1;
    rctx.beginPath();
    rctx.arc(lx, ly, 7 + 2 * Math.sin(simTime * 0.03 + i), 0, Math.PI * 2);
    rctx.stroke();
  }

  // Creature blip (red)
  const creatureDist = Math.sqrt((creature.x - player.x) ** 2 + (creature.y - player.y) ** 2);
  if (creatureDist < 300) {
    const ca = Math.atan2(creature.y - player.y, creature.x - player.x);
    const cd = (creatureDist / 300) * r * 0.8;
    const bx2 = cx + Math.cos(ca) * cd;
    const by2 = cy + Math.sin(ca) * cd;
    const blink = 0.5 + 0.5 * Math.sin(simTime * 0.1);
    rctx.fillStyle = `rgba(255, 40, 30, ${blink})`;
    rctx.shadowColor = '#ff2820';
    rctx.shadowBlur = 8;
    rctx.beginPath();
    rctx.arc(bx2, by2, 5, 0, Math.PI * 2);
    rctx.fill();
    rctx.shadowBlur = 0;
  }
}

const bpCanvas = document.getElementById('blueprint-canvas');

function drawBlueprint() {

  if (bpCanvas.width !== w * dpr) {
    bpCanvas.width = w * dpr;

  }
  bpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Blueprint grid

  bpCtx.lineWidth = 0.5;
  for (let x = 0; x < w; x += 40) {
    bpCtx.beginPath(); bpCtx.moveTo(x, 0); bpCtx.lineTo(x, h); bpCtx.stroke();
  }
  for (let y = 0; y < h; y += 40) {
    bpCtx.beginPath(); bpCtx.moveTo(0, y); bpCtx.lineTo(w, y); bpCtx.stroke();
  }

  // Pipe network (blueprint style)
  bpCtx.strokeStyle = 'rgba(100, 180, 255, 0.5)';
  bpCtx.lineWidth = 2;
  bpCtx.setLineDash([6, 4]);

  // Horizontal mains
  for (let y = 80; y < h; y += 160) {
    bpCtx.beginPath();
    bpCtx.moveTo(60, y);
    bpCtx.lineTo(w - 60, y);
    bpCtx.stroke();
  }
  // Vertical mains
  for (let x = 100; x < w; x += 200) {
    bpCtx.beginPath();
    bpCtx.moveTo(x, 60);
    bpCtx.lineTo(x, h - 60);
    bpCtx.stroke();
  }
  bpCtx.setLineDash([]);

  // Leak nodes
  const leakNodes = [
    [0.2, 0.3], [0.6, 0.2], [0.8, 0.5], [0.3, 0.7], [0.5, 0.8],
  ];
  for (let i = 0; i < leakNodes.length; i++) {
    if (i / leakNodes.length < state.flood) {
      const [nx, ny] = leakNodes[i];
      const lx = nx * w;
      const ly = ny * h;
      bpCtx.fillStyle = 'rgba(255, 80, 60, 0.6)';
      bpCtx.beginPath();
      bpCtx.arc(lx, ly, 6, 0, Math.PI * 2);
      bpCtx.fill();
      bpCtx.strokeStyle = 'rgba(255, 80, 60, 0.3)';
      bpCtx.lineWidth = 1;
      bpCtx.beginPath();
      bpCtx.arc(lx, ly, 10 + 3 * Math.sin(simTime * 0.04 + i), 0, Math.PI * 2);
      bpCtx.stroke();
    }
  }

  // Grease smudges (obscure uncleaned sectors)
  const smudgeCount = Math.floor((1 - state.flood) * 8);
  for (let i = 0; i < smudgeCount; i++) {
    const sx = ((i * 137 + 50) % w);
    const sy = ((i * 211 + 80) % h);
    const sr = 30 + (i * 13) % 40;
    const grad = bpCtx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    grad.addColorStop(0, 'rgba(40, 30, 15, 0.5)');
    grad.addColorStop(1, 'rgba(40, 30, 15, 0)');
    bpCtx.fillStyle = grad;
    bpCtx.beginPath();
    bpCtx.arc(sx, sy, sr, 0, Math.PI * 2);
    bpCtx.fill();
  }

  // Cleaned sector outlines (green)
  bpCtx.strokeStyle = 'rgba(50, 200, 100, 0.3)';
  bpCtx.lineWidth = 1;
  bpCtx.setLineDash([3, 3]);
  const cleaned = Math.floor(state.flood * 4);
  for (let i = 0; i < cleaned; i++) {
    const cx = (i * 250 + 100) % (w - 100);
    const cy = (i * 180 + 100) % (h - 100);
    bpCtx.strokeRect(cx, cy, 80, 60);
  }
  bpCtx.setLineDash([]);

  // Compass rose
  bpCtx.save();
  bpCtx.translate(w - 80, 80);
  bpCtx.strokeStyle = 'rgba(100, 150, 255, 0.4)';
  bpCtx.lineWidth = 1;
  bpCtx.beginPath();
  bpCtx.arc(0, 0, 25, 0, Math.PI * 2);
  bpCtx.stroke();
  bpCtx.beginPath();
  bpCtx.moveTo(0, -25); bpCtx.lineTo(0, 25);
  bpCtx.moveTo(-25, 0); bpCtx.lineTo(25, 0);
  bpCtx.stroke();
  bpCtx.fillStyle = 'rgba(100, 150, 255, 0.6)';
  bpCtx.font = '10px Courier New';
  bpCtx.textAlign = 'center';
  bpCtx.fillText('N', 0, -30);
  bpCtx.restore();

  // Title block
  bpCtx.fillStyle = 'rgba(100, 150, 255, 0.5)';
  bpCtx.font = '11px Courier New';
  bpCtx.textAlign = 'left';
  bpCtx.fillText('LEAKROOMS — SECTOR PLAN', 20, h - 40);
  bpCtx.fillText('SCALE 1:50', 20, h - 25);
  bpCtx.fillText(`STATUS: ${Math.round(state.flood * 100)}% FLOOD`, 20, h - 10);
}

const clipCanvas = document.getElementById('clip-canvas');

function drawClipboard() {

  cctx.clearRect(0, 0, w, h);

  // LCD background
  cctx.fillStyle = '#1a2010';
  cctx.fillRect(0, 0, w, h);

  // Scanlines
  cctx.fillStyle = 'rgba(0,0,0,0.1)';
  for (let y = 0; y < h; y += 2) {

  }

  // Pipe nodes
  const nodes = [
    { x: 40, y: 30, state: 'ok' },

    { x: 160, y: 30, state: 'ok' },
    { x: 220, y: 30, state: 'leak' },
    { x: 70, y: 70, state: 'ok' },
    { x: 130, y: 70, state: state.flood > 0.5 ? 'leak' : 'ok' },

  ];

  // Connections
  cctx.strokeStyle = 'rgba(120, 160, 80, 0.5)';
  cctx.lineWidth = 1;
  const conns = [[0,1],[1,2],[2,3],[0,4],[1,5],[2,6],[4,5],[5,6]];
  for (const [a, b] of conns) {
    cctx.beginPath();
    cctx.moveTo(nodes[a].x, nodes[a].y);
    cctx.lineTo(nodes[b].x, nodes[b].y);

  // Nodes
  for (let i = 0; i < nodes.length; i++) {

      : '#5a8a3a';
    cctx.fillStyle = color;
    cctx.beginPath();
    cctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
    cctx.fill();
    cctx.strokeStyle = 'rgba(200, 220, 150, 0.5)';
    cctx.lineWidth = 1;
    cctx.stroke();
  }

  // Proximity bar
  const creatureDist = Math.sqrt((creature.x - player.x) ** 2 + (creature.y - player.y) ** 2);
  const proximity = Math.max(0, 1 - creatureDist / 400);
  cctx.fillStyle = '#3a4030';
  cctx.fillRect(220, 50, 60, 8);
  const barColor = proximity > 0.6 ? '#ff3333' : proximity > 0.3 ? '#ffcc33' : '#5a8a3a';
  cctx.fillStyle = barColor;
  cctx.fillRect(220, 50, 60 * proximity, 8);
  cctx.fillStyle = '#7a9a4a';
  cctx.font = '7px Courier New';
  cctx.textAlign = 'left';

    cctx.fillStyle = `rgba(255, 50, 40, ${0.5 + 0.5 * Math.sin(simTime * 0.1)})`;
    cctx.fillText('!! ENTITY !!', 190, 110);
  }
}

// HUD: CONCEPT 3C — Architect's Sketch with Water Ingress
// ============================================================
const sketchCanvas = document.getElementById('sketch-canvas');
const skctx = sketchCanvas.getContext('2d');

function drawSketch() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  if (sketchCanvas.width !== w * dpr) {
    sketchCanvas.width = w * dpr;
    sketchCanvas.height = h * dpr;
    sketchCanvas.style.width = w + 'px';
    sketchCanvas.style.height = h + 'px';
  }
  skctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  skctx.clearRect(0, 0, w, h);

  // Paper background (translucent)
  skctx.fillStyle = 'rgba(236, 224, 112, 0.06)';
  skctx.fillRect(0, 0, w, h);

  // Sketch lines that dissolve with flood
  const dissolve = state.flood;

  // Room outline
  skctx.strokeStyle = `rgba(26, 20, 8, ${0.5 * (1 - dissolve * 0.5)})`;
  skctx.lineWidth = 1;
  skctx.setLineDash([]);

  const rooms = [
    [80, 80, 200, 150],
    [300, 80, 180, 200],
    [500, 100, 220, 130],
    [100, 260, 160, 180],
    [280, 300, 200, 160],
    [500, 260, 180, 200],
  ];

  for (let i = 0; i < rooms.length; i++) {
    const [rx, ry, rw, rh] = rooms[i];
    // Dissolve effect: bottom-up
    const roomDissolve = Math.max(0, dissolve * 1.5 - i * 0.1);
    if (roomDissolve < 0.8) {
      const alpha = (1 - roomDissolve) * 0.5;
      skctx.strokeStyle = `rgba(26, 20, 8, ${alpha})`;

      if (roomDissolve > 0.3) {
        // Partial draw - bottom dissolves
        const drawH = rh * (1 - roomDissolve);
        skctx.beginPath();
        skctx.moveTo(rx, ry);
        skctx.lineTo(rx, ry + drawH);
        skctx.lineTo(rx + rw, ry + drawH);
        skctx.stroke();
        // Top still visible
        skctx.beginPath();
        skctx.moveTo(rx, ry);
        skctx.lineTo(rx + rw, ry);
        skctx.lineTo(rx + rw, ry + drawH * 0.5);
        skctx.stroke();
      } else {
        skctx.strokeRect(rx, ry, rw, rh);
      }

      // Ink bleed spots
      if (dissolve > 0.4) {
        const bleedAlpha = (dissolve - 0.4) * 0.8;
        for (let j = 0; j < 3; j++) {
          const bx = rx + ((i * 73 + j * 47) % rw);
          const by = ry + drawH || ry + rh;
          skctx.fillStyle = `rgba(42, 90, 122, ${bleedAlpha * 0.4})`;
          skctx.beginPath();
          skctx.arc(bx, by, 3 + dissolve * 5, 0, Math.PI * 2);
          skctx.fill();
        }
      }
    }
  }

  // Door markers
  for (let i = 0; i < 3; i++) {
    const dx = 150 + i * 200;
    const dy = 200 + (i % 2) * 150;
    skctx.strokeStyle = `rgba(26, 20, 8, ${0.4 * (1 - dissolve)})`;
    skctx.lineWidth = 1.5;
    skctx.beginPath();
    skctx.arc(dx, dy, 8, 0, Math.PI * 2);
    skctx.stroke();
    skctx.beginPath();
    skctx.moveTo(dx - 5, dy); skctx.lineTo(dx + 5, dy);
    skctx.stroke();
  }

  // Water stains rising
  if (dissolve > 0.1) {
    const stainH = dissolve * h * 0.3;
    const grad = skctx.createLinearGradient(0, h - stainH, 0, h);
    grad.addColorStop(0, 'rgba(42, 90, 122, 0)');
    grad.addColorStop(1, `rgba(42, 90, 122, ${dissolve * 0.4})`);
    skctx.fillStyle = grad;
    skctx.fillRect(0, h - stainH, w, stainH);

    // Water line
    skctx.strokeStyle = `rgba(100, 160, 200, ${dissolve * 0.6})`;
    skctx.lineWidth = 2;
    skctx.beginPath();
    for (let x = 0; x < w; x += 5) {
      const wy = h - stainH + Math.sin(x * 0.02 + simTime * 0.03) * 3 * dissolve;
      x === 0 ? skctx.moveTo(x, wy) : skctx.lineTo(x, wy);
    }
    skctx.stroke();
  }

  // Dimension lines
  skctx.strokeStyle = `rgba(26, 20, 8, ${0.25 * (1 - dissolve)})`;
  skctx.lineWidth = 0.5;
  skctx.setLineDash([4, 4]);
  skctx.beginPath();
  skctx.moveTo(80, 60); skctx.lineTo(280, 60);
  skctx.stroke();
  skctx.beginPath();
  skctx.moveTo(80, 55); skctx.lineTo(80, 65);
  skctx.moveTo(280, 55); skctx.lineTo(280, 65);
  skctx.stroke();
  skctx.setLineDash([]);
}

// HUD: CONCEPT 4A — Condensation Lens
// ============================================================
const condCanvas = document.getElementById('condensation-canvas');
const ccCtx = condCanvas.getContext('2d');

function drawCondensation() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  if (condCanvas.width !== w * dpr) {
    condCanvas.width = w * dpr;
    condCanvas.height = h * dpr;
    condCanvas.style.width = w + 'px';
    condCanvas.style.height = h + 'px';
  }
  ccCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ccCtx.clearRect(0, 0, w, h);

  // Fog on lens
  if (state.flood > 0.1) {
    const fogAlpha = state.flood * 0.25;
    const grad = ccCtx.createRadialGradient(w/2, h/2, w * 0.1, w/2, h/2, w * 0.5);
    grad.addColorStop(0, 'rgba(200, 210, 220, 0)');
    grad.addColorStop(1, `rgba(200, 210, 220, ${fogAlpha})`);
    ccCtx.fillStyle = grad;
    ccCtx.fillRect(0, 0, w, h);
  }

  // Water droplets on edges
  const dropCount = Math.floor(state.flood * 40);
  for (let i = 0; i < dropCount; i++) {
    const side = i % 4;
    let dx, dy;
    if (side === 0) { dx = Math.random() * w; dy = Math.random() * 30; }
    else if (side === 1) { dx = Math.random() * w; dy = h - Math.random() * 30; }
    else if (side === 2) { dx = Math.random() * 30; dy = Math.random() * h; }
    else { dx = w - Math.random() * 30; dy = Math.random() * h; }

    const drip = Math.sin(simTime * 0.02 + i) * state.flood * 10;
    ccCtx.fillStyle = `rgba(150, 180, 200, ${0.3 + state.flood * 0.3})`;
    ccCtx.beginPath();
    ccCtx.ellipse(dx, dy + drip, 2, 3 + state.flood * 2, 0, 0, Math.PI * 2);
    ccCtx.fill();

    // Highlight
    ccCtx.fillStyle = `rgba(255, 255, 255, ${0.2 + state.flood * 0.2})`;
    ccCtx.beginPath();
    ccCtx.arc(dx - 0.5, dy + drip - 0.5, 0.8, 0, Math.PI * 2);
    ccCtx.fill();
  }

  // Rust eating into corners (health drops = flood rises)
  if (state.flood > 0.3) {
    const rustAlpha = (state.flood - 0.3) * 0.8;
    const rustSize = state.flood * 120;

    const corners = [[0,0],[w,0],[0,h],[w,h]];
    for (const [cx, cy] of corners) {
      const grad = ccCtx.createRadialGradient(cx, cy, 0, cx, cy, rustSize);
      grad.addColorStop(0, `rgba(139, 69, 19, ${rustAlpha})`);
      grad.addColorStop(0.5, `rgba(101, 37, 10, ${rustAlpha * 0.5})`);
      grad.addColorStop(1, 'rgba(60, 20, 5, 0)');
      ccCtx.fillStyle = grad;
      // Clip to corner
      ccCtx.save();
      ccCtx.beginPath();
      if (cx === 0 && cy === 0) ccCtx.rect(0, 0, rustSize, rustSize);
      else if (cx === w && cy === 0) ccCtx.rect(w - rustSize, 0, rustSize, rustSize);
      else if (cx === 0 && cy === h) ccCtx.rect(0, h - rustSize, rustSize, rustSize);
      else ccCtx.rect(w - rustSize, h - rustSize, rustSize, rustSize);
      ccCtx.clip();
      ccCtx.fillRect(0, 0, w, h);
      ccCtx.restore();
    }

    // Rust streaks
    ccCtx.strokeStyle = `rgba(139, 69, 19, ${rustAlpha * 0.4})`;
    ccCtx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const cx = i < 4 ? 0 : w;
      const cy = (i % 2) * h;
      ccCtx.beginPath();
      ccCtx.moveTo(cx, cy);
      ccCtx.lineTo(cx + (cx === 0 ? 1 : -1) * rustSize * (0.5 + Math.random() * 0.5), cy + (Math.random() - 0.5) * 80);
      ccCtx.stroke();
    }
  }

  // Breath condensation patches
  if (state.noise > 0.3) {
    const breathAlpha = (state.noise - 0.3) * 0.3;
    const patchY = h * 0.3 + Math.sin(simTime * 0.01) * 10;
    const grad = ccCtx.createRadialGradient(w/2, patchY, 0, w/2, patchY, 80);
    grad.addColorStop(0, `rgba(220, 230, 240, ${breathAlpha})`);
    grad.addColorStop(1, 'rgba(220, 230, 240, 0)');
    ccCtx.fillStyle = grad;
    ccCtx.fillRect(w/2 - 80, patchY - 80, 160, 160);
  }
}

// HUD: CONCEPT 4B — Flashlight & Mold
// ============================================================
const moldCanvas = document.getElementById('mold-canvas');
const mctx = moldCanvas.getContext('2d');

function drawMold() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  if (moldCanvas.width !== w * dpr) {
    moldCanvas.width = w * dpr;
    moldCanvas.height = h * dpr;
    moldCanvas.style.width = w + 'px';
    moldCanvas.style.height = h + 'px';
  }
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.clearRect(0, 0, w, h);

  // Shrinking vignette (flood = reduced vision)
  const vignetteRadius = Math.max(w, h) * (0.8 - state.flood * 0.4);
  const grad = mctx.createRadialGradient(w/2, h/2, vignetteRadius * 0.3, w/2, h/2, vignetteRadius);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  grad.addColorStop(0.7, `rgba(0, 0, 0, ${0.3 + state.flood * 0.3})`);
  grad.addColorStop(1, `rgba(0, 0, 0, ${0.6 + state.flood * 0.35})`);
  mctx.fillStyle = grad;
  mctx.fillRect(0, 0, w, h);

  // Mold creeping inward from edges
  if (state.flood > 0.2) {
    const moldSize = state.flood * 100;
    const edges = 8;

    for (let i = 0; i < edges; i++) {
      const side = i % 4;
      const progress = state.flood;

      mctx.fillStyle = `rgba(10, 15, 5, ${0.4 + progress * 0.3})`;

      for (let j = 0; j < 6; j++) {
        const t = j / 6;
        let mx, my, mr;
        const creep = (Math.sin(simTime * 0.015 + i + j) * 0.3 + 0.7) * moldSize;

        if (side === 0) { // top
          mx = t * w; my = creep * 0.5;
          mr = 15 + progress * 25;
        } else if (side === 1) { // bottom
          mx = t * w; my = h - creep * 0.5;
          mr = 15 + progress * 25;
        } else if (side === 2) { // left
          mx = creep * 0.5; my = t * h;
          mr = 15 + progress * 25;
        } else { // right
          mx = w - creep * 0.5; my = t * h;
          mr = 15 + progress * 25;
        }

        mctx.beginPath();
        mctx.arc(mx, my, mr, 0, Math.PI * 2);
        mctx.fill();

        // Mold spots
        if (j > 2) {
          mctx.fillStyle = `rgba(20, 30, 10, ${0.3 + progress * 0.2})`;
          mctx.beginPath();
          mctx.arc(mx + (Math.random()-0.5)*20, my + (Math.random()-0.5)*20, mr * 0.5, 0, Math.PI * 2);
          mctx.fill();
          mctx.fillStyle = `rgba(10, 15, 5, ${0.4 + progress * 0.3})`;
        }
      }
    }

    // Slime drips near leaks
    if (state.noise > 0.4) {
      const dripCount = Math.floor(state.noise * 10);
      for (let i = 0; i < dripCount; i++) {
        const dx = Math.random() * w;
        const dy = Math.random() * h * 0.3;
        mctx.fillStyle = `rgba(15, 25, 8, ${0.3 + state.noise * 0.3})`;
        mctx.beginPath();
        mctx.ellipse(dx, dy, 3, 6 + state.noise * 8, 0, 0, Math.PI * 2);
        mctx.fill();
      }
    }
  }
}

// ============================================================
// HUD: CONCEPT 4C — Heat & Pressure Distortion
// ============================================================
const warpCanvas = document.getElementById('warp-canvas');
const wctx2 = warpCanvas.getContext('2d');

function drawWarp() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  if (warpCanvas.width !== w * dpr) {
    warpCanvas.width = w * dpr;
    warpCanvas.height = h * dpr;
    warpCanvas.style.width = w + 'px';
    warpCanvas.style.height = h + 'px';
  }
  wctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  wctx2.clearRect(0, 0, w, h);

  const intensity = state.pressure;

  if (intensity < 0.1) return;

  // Chromatic aberration at edges
  const edgeWidth = intensity * 60;

  // Red channel offset (right)
  wctx2.strokeStyle = `rgba(255, 0, 0, ${intensity * 0.15})`;
  wctx2.lineWidth = 1;
  for (let y = 0; y < h; y += 3) {
    const offset = Math.sin(y * 0.02 + simTime * 0.03) * intensity * 3;
    wctx2.beginPath();
    wctx2.moveTo(w - edgeWidth + offset, y);
    wctx2.lineTo(w, y);
    wctx2.stroke();
    wctx2.beginPath();
    wctx2.moveTo(0, y);
    wctx2.lineTo(edgeWidth + offset, y);
    wctx2.stroke();
  }

  // Blue channel offset (left)
  wctx2.strokeStyle = `rgba(0, 0, 255, ${intensity * 0.1})`;
  for (let y = 0; y < h; y += 3) {
    const offset = Math.cos(y * 0.025 + simTime * 0.035) * intensity * 3;
    wctx2.beginPath();
    wctx2.moveTo(w - edgeWidth - offset, y);
    wctx2.lineTo(w, y);
    wctx2.stroke();
    wctx2.beginPath();
    wctx2.moveTo(0, y);
    wctx2.lineTo(edgeWidth - offset, y);
    wctx2.stroke();
  }

  // Heat shimmer (wavy lines at edges)
  wctx2.strokeStyle = `rgba(255, 200, 100, ${intensity * 0.2})`;
  wctx2.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const x = i < 3 ? i * 10 : w - (i - 2) * 10;
    wctx2.beginPath();
    for (let y = 0; y < h; y += 4) {
      const wx = x + Math.sin(y * 0.03 + simTime * 0.05 + i) * intensity * 8;
      y === 0 ? wctx2.moveTo(wx, y) : wctx2.lineTo(wx, y);
    }
    wctx2.stroke();
  }

  // Steam blur (foggy patches at edges)
  if (intensity > 0.3) {
    const steamAlpha = (intensity - 0.3) * 0.4;
    for (let i = 0; i < 4; i++) {
      const sx = i < 2 ? Math.random() * 40 : w - Math.random() * 40;
      const sy = Math.random() * h;
      const grad = wctx2.createRadialGradient(sx, sy, 0, sx, sy, 50 + intensity * 40);
      grad.addColorStop(0, `rgba(220, 210, 180, ${steamAlpha})`);
      grad.addColorStop(1, 'rgba(220, 210, 180, 0)');
      wctx2.fillStyle = grad;
      wctx2.fillRect(sx - 80, sy - 80, 160, 160);
    }
  }

  // Critical pressure warning
  if (intensity > 0.8) {
    const flash = Math.sin(simTime * 0.15) > 0.5;
    if (flash) {
      wctx2.strokeStyle = `rgba(255, 50, 30, ${(intensity - 0.8) * 2})`;
      wctx2.lineWidth = 3;
      wctx2.strokeRect(5, 5, w - 10, h - 10);
    }
  }

  // Warp distortion rings
  wctx2.strokeStyle = `rgba(255, 220, 100, ${intensity * 0.1})`;
  wctx2.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const r = 50 + i * 30 + Math.sin(simTime * 0.02 + i) * 10;
    wctx2.beginPath();
    wctx2.arc(w/2, h/2, r, 0, Math.PI * 2);
    wctx2.stroke();
  }
}

// ============================================================
// HUD SWITCHING
// ============================================================
const hudIds = ['hud-1a','hud-1b','hud-1c','hud-2a','hud-2b','hud-2c','hud-3a','hud-3b','hud-3c','hud-4a','hud-4b','hud-4c'];
const hudNames = {
  '1a': 'Concept 1A — Belt Pressure Valve',
  '1b': 'Concept 1B — Tool Backpack LED Ring',
  '1c': 'Concept 1C — Wear & Tear',
  '2a': 'Concept 2A — Green Phosphor Oscilloscope',
  '2b': 'Concept 2B — Analog Boiler Dashboard',
  '2c': 'Concept 2C — Sonar / Diagnostic Sweep',
  '3a': 'Concept 3A — Stained Paper Blueprint',
  '3b': 'Concept 3B — Digital Maintenance Clipboard',
  '3c': 'Concept 3C — Architect\'s Sketch with Water Ingress',
  '4a': 'Concept 4A — Condensation Lens',
  '4b': 'Concept 4B — Claustrophobic Flashlight & Mold',
  '4c': 'Concept 4C — Heat & Pressure Distortion',
};

function showHUD(concept, varKey) {
  const id = `hud-${concept}${varKey}`;
  for (const hudId of hudIds) {
    document.getElementById(hudId).classList.add('hidden');
  }
  const target = document.getElementById(id);
  if (target) target.classList.remove('hidden');

  const label = document.getElementById('active-label');
  label.textContent = hudNames[`${concept}${varKey}`] || '';

  // Init scope canvas size on first show
  if (id === 'hud-2a') {
    setTimeout(initScope, 50);
  }
}

// ============================================================
// TOOLBAR INTERACTIONS
// ============================================================
document.querySelectorAll('#concept-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#concept-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.concept = parseInt(btn.dataset.concept);
    showHUD(state.concept, state.var);
  });
});

document.querySelectorAll('#var-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#var-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.var = btn.dataset.var;
    showHUD(state.concept, state.var);
  });
});

document.getElementById('shot-toggle').addEventListener('click', toggleHiddenUI);

function toggleHiddenUI() {
  state.hiddenUI = !state.hiddenUI;
  document.getElementById('toolbar').classList.toggle('hidden-ui', state.hiddenUI);
  document.getElementById('side-panel').classList.toggle('hidden-ui', state.hiddenUI);
  document.getElementById('active-label').classList.toggle('hidden-ui', state.hiddenUI);
  const btn = document.getElementById('shot-toggle');
  btn.classList.toggle('on', state.hiddenUI);
  btn.textContent = state.hiddenUI ? 'Show UI (H)' : 'Hide UI (H)';
}

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '4') {
    state.concept = parseInt(e.key);
    document.querySelectorAll('#concept-tabs button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.concept) === state.concept);
    });
    showHUD(state.concept, state.var);
  } else if (e.key === 'a' || e.key === 'A') {
    state.var = 'a';
    document.querySelectorAll('#var-tabs button').forEach(b => b.classList.toggle('active', b.dataset.var === 'a'));
    showHUD(state.concept, state.var);
  } else if (e.key === 'b' || e.key === 'B') {
    state.var = 'b';
    document.querySelectorAll('#var-tabs button').forEach(b => b.classList.toggle('active', b.dataset.var === 'b'));
    showHUD(state.concept, state.var);
  } else if (e.key === 'c' || e.key === 'C') {
    state.var = 'c';
    document.querySelectorAll('#var-tabs button').forEach(b => b.classList.toggle('active', b.dataset.var === 'c'));
    showHUD(state.concept, state.var);
  } else if (e.key === 'h' || e.key === 'H') {
    toggleHiddenUI();
  } else if (e.key === ' ') {
    e.preventDefault();
    wheelVisible = true;
  }
});

window.addEventListener('keyup', (e) => {
  if (e.key === ' ') wheelVisible = false;
});

// ============================================================
// SLIDERS
// ============================================================
document.getElementById('noise-slider').addEventListener('input', (e) => {
  state.noise = e.target.value / 100;
  document.getElementById('noise-val').textContent = e.target.value;
});
document.getElementById('flood-slider').addEventListener('input', (e) => {
  state.flood = e.target.value / 100;
  document.getElementById('flood-val').textContent = e.target.value;
});
document.getElementById('pressure-slider').addEventListener('input', (e) => {
  state.pressure = e.target.value / 100;
  document.getElementById('pressure-val').textContent = e.target.value;
});

// ============================================================
// MAIN LOOP
// ============================================================
function gameLoop() {
  simTime++;

  // Clear
  gctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  // Draw background
  drawBackground();
  drawCreature();
  drawPlayer();
  drawFlashlight();

  // Draw active HUD
  const hudKey = `${state.concept}${state.var}`;
  switch (hudKey) {
    case '1a': drawBeltHUD(); break;
    case '1b': drawBackpackHUD(); break;
    case '1c': drawWearHUD(); break;
    case '2a': drawScope(); break;
    case '2b': drawBoiler(); break;
    case '2c': drawSonar(); break;
    case '3a': drawBlueprint(); break;
    case '3b': drawClipboard(); break;
    case '3c': drawSketch(); break;
    case '4a': drawCondensation(); break;
    case '4b': drawMold(); break;
    case '4c': drawWarp(); break;
  }

  requestAnimationFrame(gameLoop);
}

// Start
showHUD(state.concept, state.var);
gameLoop();
</script>
