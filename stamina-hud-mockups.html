<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stamina HUD field tests</title>
  <style>
    :root{
      color-scheme:dark;
      --ink:#1c1a14;
      --black:#080906;
      --glass:#11120d;
      --glass-hi:#1a1b13;
      --carpet:#c3cb6e;
      --yellow:#e4e6a8;
      --dim:#9ca05b;
      --deep:#686d3b;
      --danger:#d8503c;
      --water:#8fc4cc;
      --stamina:#8fd07a;
      --line:rgba(228,230,168,.22);
      --mono:"Courier New",Courier,monospace;
    }

    *{box-sizing:border-box}
    body{
      min-width:320px;
      min-height:100vh;
      margin:0;
      padding:28px;
      background:
        radial-gradient(ellipse at 50% -20%,rgba(195,203,110,.12),transparent 55%),
        var(--black);
      color:var(--yellow);
      font:14px/1.45 var(--mono);
    }
    button,input{font:inherit}
    button{color:inherit}
    button:focus-visible,input:focus-visible{
      outline:2px solid var(--yellow);
      outline-offset:3px;
    }
    .page{max-width:1460px;margin:0 auto}
    .topline{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:24px;
      margin-bottom:22px;
    }
    h1{
      max-width:720px;
      margin:0;
      color:var(--yellow);
      font-size:clamp(25px,3vw,42px);
      font-weight:400;
      line-height:1.04;
      letter-spacing:-.06em;
    }
    .intro{
      max-width:400px;
      margin:10px 0 0;
      color:var(--dim);
      font-size:13px;
    }
    .count{
      flex:none;
      padding:8px 11px;
      border:1px solid var(--line);
      color:var(--carpet);
      font-size:11px;
      letter-spacing:.12em;
    }

    .workbench{
      display:grid;
      grid-template-columns:minmax(320px,.82fr) minmax(0,1.55fr);
      gap:18px;
      align-items:stretch;
    }
    .preview,.controls,.choice{
      border:1px solid var(--line);
      background:rgba(17,18,13,.92);
    }
    .preview{display:flex;flex-direction:column;min-width:0}
    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:49px;
      padding:10px 14px;
      border-bottom:1px solid var(--line);
    }
    .panel-head h2{
      margin:0;
      font-size:13px;
      font-weight:400;
      letter-spacing:.03em;
    }
    .panel-head span{
      color:var(--dim);
      font-size:10px;
      white-space:nowrap;
    }
    .world{
      position:relative;
      isolation:isolate;
      min-height:238px;
      flex:1;
      overflow:hidden;
      background:
        linear-gradient(90deg,transparent 49.8%,rgba(228,230,168,.055) 50%,transparent 50.2%),
        linear-gradient(0deg,transparent 49.8%,rgba(228,230,168,.055) 50%,transparent 50.2%),
        repeating-linear-gradient(90deg,transparent 0 39px,rgba(228,230,168,.055) 39px 40px),
        repeating-linear-gradient(0deg,transparent 0 39px,rgba(228,230,168,.055) 39px 40px),
        linear-gradient(130deg,#303124,#202117 48%,#292a1d);
    }
    .world::before,.world::after{
      position:absolute;
      z-index:-1;
      right:-8%;
      left:-8%;
      height:23px;
      content:"";
      background:
        repeating-linear-gradient(90deg,rgba(228,230,168,.16) 0 18px,transparent 18px 22px),
        linear-gradient(#10110d,#080906);
      border-block:1px solid rgba(228,230,168,.24);
      box-shadow:0 2px 8px #000;
    }
    .world::before{top:0}
    .world::after{bottom:0}
    .pipe{
      position:absolute;
      top:28px;
      right:15%;
      width:5px;
      height:54px;
      border:1px solid rgba(143,196,204,.45);
      background:linear-gradient(90deg,#344448,#8fc4cc,#344448);
      box-shadow:0 0 10px rgba(143,196,204,.16);
    }
    .waterline{
      position:absolute;
      top:81px;
      right:calc(15% - 19px);
      width:42px;
      height:20px;
      border-bottom:2px solid rgba(143,196,204,.65);
      border-radius:50%;
      opacity:.8;
    }
    .plumber{
      position:absolute;
      top:50%;
      left:58%;
      width:27px;
      height:35px;
      transform:translate(-50%,-50%);
      filter:drop-shadow(0 3px 4px rgba(0,0,0,.8));
    }
    .plumber svg{display:block;width:100%;height:100%}
    .meter-dock{
      position:absolute;
      top:calc(50% - 57px);
      left:calc(58% - 133px);
      display:flex;
      align-items:center;
      justify-content:center;
      width:108px;
      height:72px;
      border:1px dashed rgba(228,230,168,.11);
      background:rgba(8,9,6,.22);
    }
    .world-note{
      position:absolute;
      right:12px;
      bottom:9px;
      color:rgba(228,230,168,.52);
      font-size:9px;
      letter-spacing:.1em;
    }
    .selected-copy{
      min-height:74px;
      padding:12px 14px 14px;
      border-top:1px solid var(--line);
    }
    .selected-copy h3{margin:0 0 4px;font-size:15px;font-weight:400}
    .selected-copy p{margin:0;color:var(--dim);font-size:11px}

    .controls{
      display:flex;
      align-items:center;
      gap:16px;
      padding:12px 14px;
    }
    .control-title{flex:none}
    .control-title label{display:block;font-size:12px}
    .control-title output{display:block;margin-top:3px;color:var(--carpet);font-size:11px}
    input[type="range"]{
      width:min(240px,30vw);
      accent-color:var(--stamina);
    }
    .presets{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
    .preset{
      padding:6px 8px;
      border:1px solid var(--line);
      border-radius:0;
      background:transparent;
      color:var(--dim);
      font-size:10px;
      cursor:pointer;
    }
    .preset[aria-pressed="true"]{
      border-color:var(--carpet);
      color:var(--yellow);
      background:rgba(195,203,110,.1);
    }
    .preset:hover{border-color:var(--yellow);color:var(--yellow)}

    .gallery-wrap{display:flex;flex-direction:column;min-width:0}
    .gallery-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:49px;
      padding:10px 14px;
      border:1px solid var(--line);
      border-bottom:0;
      background:var(--glass);
    }
    .gallery-head h2{margin:0;font-size:13px;font-weight:400}
    .gallery-head p{margin:0;color:var(--dim);font-size:10px}
    .gallery{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:7px;
    }
    .choice{
      display:flex;
      min-width:0;
      min-height:137px;
      flex-direction:column;
      padding:0;
      text-align:left;
      cursor:pointer;
    }
    .choice:hover{border-color:rgba(228,230,168,.62)}
    .choice[aria-pressed="true"]{
      border-color:var(--carpet);
      box-shadow:inset 0 0 0 1px var(--carpet);
    }
    .mini-world{
      position:relative;
      display:grid;
      min-height:88px;
      flex:1;
      place-items:center;
      overflow:hidden;
      background:
        repeating-linear-gradient(90deg,transparent 0 23px,rgba(228,230,168,.045) 23px 24px),
        repeating-linear-gradient(0deg,transparent 0 23px,rgba(228,230,168,.045) 23px 24px),
        linear-gradient(135deg,#292a1d,#1b1c14);
    }
    .mini-world::before,.mini-world::after{
      position:absolute;
      right:0;
      left:0;
      height:8px;
      content:"";
      background:repeating-linear-gradient(90deg,#0b0c08 0 11px,#484a2e 11px 13px);
    }
    .mini-world::before{top:0}
    .mini-world::after{bottom:0}
    .mini-plumber{
      position:absolute;
      right:19%;
      bottom:25px;
      width:12px;
      height:16px;
      border:1px solid #11120d;
      border-radius:45% 45% 35% 35%;
      background:var(--carpet);
      box-shadow:0 0 0 2px rgba(0,0,0,.4);
    }
    .mini-plumber::before{
      position:absolute;
      top:-3px;
      left:1px;
      width:8px;
      height:4px;
      border:1px solid #11120d;
      border-radius:50% 50% 20% 20%;
      content:"";
      background:var(--yellow);
    }
    .mini-dock{
      position:absolute;
      top:50%;
      left:12%;
      display:grid;
      width:72%;
      height:38px;
      place-items:center;
      transform:translateY(-50%);
    }
    .choice-label{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:5px;
      padding:7px 8px 8px;
      border-top:1px solid var(--line);
    }
    .choice-label b{overflow:hidden;color:var(--yellow);font-size:10px;font-weight:400;text-overflow:ellipsis;white-space:nowrap}
    .choice-label span{flex:none;color:var(--deep);font-size:9px}

    .meter{
      --progress:.5;
      --meter-color:var(--stamina);
      position:relative;
      display:flex;
      align-items:center;
      gap:7px;
      width:100%;
      height:100%;
      color:var(--meter-color);
    }
    .meter.is-empty{--meter-color:var(--danger)}
    .glyph{
      display:block;
      flex:none;
      width:19px;
      height:19px;
      overflow:visible;
      color:var(--meter-color);
      fill:none;
      stroke:currentColor;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-width:1.8;
    }
    .track{
      position:relative;
      display:block;
      min-width:0;
      height:9px;
      flex:1;
      overflow:hidden;
      border:1px solid rgba(228,230,168,.42);
      background:rgba(228,230,168,.09);
    }
    .fill{
      position:absolute;
      inset:0 auto 0 0;
      width:calc(var(--progress) * 100%);
      background:var(--meter-color);
      box-shadow:0 0 7px color-mix(in srgb,var(--meter-color),transparent 50%);
      transition:width .18s ease,height .18s ease,background-color .18s ease;
    }
    .meter--rail .track{height:11px}
    .meter--column{
      width:38px;
      flex-direction:column;
      justify-content:center;
      gap:4px;
    }
    .meter--column .glyph{width:18px;height:18px}
    .meter--column .track{
      width:9px;
      min-height:28px;
      flex:none;
      border:1px solid rgba(228,230,168,.42);
    }
    .meter--column .fill{inset:auto 0 0;width:100%;height:calc(var(--progress) * 100%)}
    .meter--steps .track{
      height:12px;
      border:0;
      background:repeating-linear-gradient(90deg,rgba(228,230,168,.13) 0 10px,transparent 10px 13px);
    }
    .meter--steps .fill{
      background:repeating-linear-gradient(90deg,var(--meter-color) 0 10px,transparent 10px 13px);
    }
    .meter--chevron .track{
      height:13px;
      border:0;
      background:repeating-linear-gradient(90deg,rgba(228,230,168,.13) 0 11px,transparent 11px 15px);
      clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);
    }
    .meter--chevron .fill{
      background:repeating-linear-gradient(90deg,var(--meter-color) 0 11px,transparent 11px 15px);
    }
    .meter--arc{width:58px;height:58px;justify-content:center}
    .meter--arc .glyph{position:absolute;z-index:1;width:17px;height:17px}
    .meter--arc .track{
      position:absolute;
      inset:0;
      width:auto;
      height:auto;
      overflow:visible;
      border:0;
      background:conic-gradient(from 240deg,var(--meter-color) 0deg var(--arc),rgba(228,230,168,.16) var(--arc) 240deg,transparent 240deg 360deg);
      mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
      --arc:calc(var(--progress) * 240deg);
    }
    .meter--arc .fill{display:none}
    .meter--lane .track{
      height:8px;
      overflow:visible;
      border:0;
      background:rgba(228,230,168,.18);
    }
    .meter--lane .fill{height:4px;top:2px}
    .meter--lane .glyph{
      position:absolute;
      z-index:1;
      left:calc(19px + (100% - 19px) * var(--progress));
      width:16px;
      height:16px;
      transform:translateX(-50%);
    }
    .meter--breath .track{
      height:22px;
      overflow:visible;
      border:0;
      background:linear-gradient(180deg,transparent 44%,rgba(228,230,168,.2) 45% 55%,transparent 56%);
    }
    .meter--breath .fill{
      top:2px;
      height:18px;
      background:var(--meter-color);
      clip-path:polygon(0 46%,12% 46%,19% 22%,26% 78%,35% 9%,44% 88%,52% 38%,62% 38%,70% 24%,78% 72%,87% 45%,100% 45%,100% 56%,87% 56%,78% 83%,70% 36%,64% 51%,54% 51%,44% 100%,35% 24%,26% 91%,19% 37%,14% 56%,0 56%);
    }
    .meter--ladder{align-items:flex-end;gap:7px}
    .meter--ladder .glyph{align-self:center}
    .meter--ladder .track{
      height:22px;
      border:0;
      background:repeating-linear-gradient(0deg,rgba(228,230,168,.14) 0 4px,transparent 4px 7px);
    }
    .meter--ladder .fill{
      background:repeating-linear-gradient(0deg,var(--meter-color) 0 4px,transparent 4px 7px);
    }
    .meter--frame{width:53px;height:45px;justify-content:center}
    .meter--frame .glyph{position:absolute;z-index:1;width:14px;height:14px}
    .meter--frame .track{
      position:absolute;
      inset:2px;
      width:auto;
      height:auto;
      border:2px solid rgba(228,230,168,.13);
      background:transparent;
      clip-path:polygon(0 0,34% 0,34% 8%,8% 8%,8% 38%,0 38%,0 0,66% 0,100% 0,100% 38%,92% 38%,92% 8%,66% 8%,66% 0,0 92%,8% 92%,8% 62%,0 62%,0 100%,100% 100%,100% 62%,92% 62%,92% 92%,8% 92%);
    }
    .meter--frame .fill{
      inset:0;
      width:100%;
      background:conic-gradient(var(--meter-color) calc(var(--progress) * 1turn),transparent 0);
      mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      mask-composite:exclude;
      padding:3px;
    }
    .meter--stride{
      width:38px;
      flex-direction:column;
      justify-content:center;
      gap:6px;
    }
    .meter--stride .glyph{width:18px;height:18px}
    .meter--stride .track{
      width:14px;
      height:42px;
      flex:none;
      border:0;
      background:repeating-linear-gradient(0deg,rgba(228,230,168,.15) 0 6px,transparent 6px 9px);
      transform:skewY(-18deg);
    }
    .meter--stride .fill{
      inset:auto 0 0;
      width:100%;
      height:calc(var(--progress) * 100%);
      background:repeating-linear-gradient(0deg,var(--meter-color) 0 6px,transparent 6px 9px);
    }
    .meter--strata .track{
      height:22px;
      border:0;
      background:repeating-linear-gradient(90deg,rgba(228,230,168,.12) 0 3px,transparent 3px 6px);
      clip-path:polygon(0 0,100% 0,88% 100%,0 100%);
    }
    .meter--strata .fill{
      background:repeating-linear-gradient(90deg,var(--meter-color) 0 3px,transparent 3px 6px);
      clip-path:polygon(0 0,100% 0,88% 100%,0 100%);
    }
    .mini-dock .meter{transform:scale(.72)}

    @media(max-width:1050px){
      body{padding:18px}
      .workbench{grid-template-columns:1fr}
      .world{min-height:210px}
      .gallery{grid-template-columns:repeat(5,minmax(0,1fr))}
    }
    @media(max-width:700px){
      body{padding:14px}
      .topline{align-items:start;flex-direction:column;gap:12px}
      .count{align-self:start}
      .controls{align-items:flex-start;flex-wrap:wrap}
      input[type="range"]{flex:1;min-width:130px;margin-top:7px}
      .presets{width:100%;margin-left:0}
      .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
      .choice{min-height:128px}
      .world{min-height:190px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div>
        <h1>Ten ways to read a sprint reserve</h1>
        <p class="intro">Same plumber. Same stamina level. Ten progress shapes to compare in the same room.</p>
      </div>
      <div class="count">5 seconds to sprint · 5 seconds to recover</div>
    </header>

    <div class="workbench">
      <section class="preview" aria-labelledby="preview-title">
        <div class="panel-head">
          <h2 id="preview-title">Selected readout</h2>
          <span id="selected-index">01 / 10</span>
        </div>
        <div class="world" aria-label="Top-down view of a carpeted room">
          <div class="pipe" aria-hidden="true"></div>
          <div class="waterline" aria-hidden="true"></div>
          <div class="plumber" aria-hidden="true">
            <svg viewBox="0 0 28 36">
              <path d="M7 16 3 23l4 2 4-5M21 16l4 7-4 2-4-5" fill="#777d48" stroke="#11120d" stroke-width="1.5"/>
              <path d="M8 16h12l2 11-4 6h-8l-4-6z" fill="#8d9851" stroke="#11120d" stroke-width="1.5"/>
              <path d="M9 5q5-4 10 0l2 5H7z" fill="#e4e6a8" stroke="#11120d" stroke-width="1.5"/>
              <ellipse cx="14" cy="12" rx="6" ry="5" fill="#b9a67c" stroke="#11120d" stroke-width="1.5"/>
              <path d="M11 12h1m4 0h1" stroke="#1c1a14" stroke-width="1.4"/>
              <path d="m22 23 3 2-2 2-3-2m2-2 3-3" fill="none" stroke="#c3cb6e" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="meter-dock" id="large-meter"></div>
          <span class="world-note">ROOM 03 · WATERLINE ACTIVE</span>
        </div>
        <div class="selected-copy" aria-live="polite">
          <h3 id="selected-name"></h3>
          <p id="selected-description"></p>
        </div>
      </section>

      <section class="gallery-wrap" aria-labelledby="gallery-title">
        <div class="gallery-head">
          <h2 id="gallery-title">Choose a progress shape</h2>
          <p>Click a sample to enlarge</p>
        </div>
        <div class="gallery" id="gallery"></div>
      </section>

      <section class="controls" aria-label="Stamina preview controls">
        <div class="control-title">
          <label for="stamina-range">Set stamina</label>
          <output id="stamina-output" for="stamina-range">2.5 s</output>
        </div>
        <input id="stamina-range" type="range" min="0" max="5" step="0.1" value="2.5" aria-label="Stamina remaining, from zero to five seconds">
        <div class="presets" role="group" aria-label="Stamina presets">
          <button class="preset" type="button" data-value="5">Full</button>
          <button class="preset" type="button" data-value="2.5" aria-pressed="true">Half</button>
          <button class="preset" type="button" data-value="1">Low</button>
          <button class="preset" type="button" data-value="0">Empty</button>
        </div>
      </section>
    </div>
  </main>

  <svg aria-hidden="true" width="0" height="0" style="position:absolute">
    <symbol id="glyph-boot" viewBox="0 0 24 24">
      <path d="M7 3v7l3 3 4 1 4 3 2 3H4l-1-2 2-4 1-4V3z"/>
      <path d="M6 17h4m2 0h3m-9 3h12"/>
    </symbol>
    <symbol id="glyph-runner" viewBox="0 0 24 24">
      <circle cx="15.5" cy="4.5" r="2"/>
      <path d="m12 9 4-2 3 3 3 1M12 9l-3 5 4 2 2 5m-6-7-5 2-2 4m7-8 5 2"/>
    </symbol>
    <symbol id="glyph-lungs" viewBox="0 0 24 24">
      <path d="M12 4v8m0-4-3-2m3 2 3-2"/>
      <path d="M9 8c-2 0-3 2-4 5l-2 6c-.5 2 1 3 3 2l5-3V9zm6 0c2 0 3 2 4 5l2 6c.5 2-1 3-3 2l-5-3V9z"/>
    </symbol>
  </svg>

  <script>
    const designs = [
      {name:'Stride rail', shape:'rail', glyph:'boot', note:'One calm, familiar sweep.'},
      {name:'Upright reserve', shape:'column', glyph:'runner', note:'Vertical fill keeps width low.'},
      {name:'Footstep trail', shape:'steps', glyph:'boot', note:'Lit steps count down the run.'},
      {name:'Forward chevrons', shape:'chevron', glyph:'runner', note:'Direction built into the bar.'},
      {name:'Open breath arc', shape:'arc', glyph:'lungs', note:'Partial arc, not a closed battery ring.'},
      {name:'Runway marker', shape:'lane', glyph:'runner', note:'Runner position shows remaining distance.'},
      {name:'Breath trace', shape:'breath', glyph:'lungs', note:'Filled waveform ties reserve to exertion.'},
      {name:'Effort ladder', shape:'ladder', glyph:'boot', note:'Stacked rungs make depletion visible.'},
      {name:'Corner trace', shape:'frame', glyph:'runner', note:'Open frame fills around a clear glyph.'},
      {name:'Vertical tread strip', shape:'stride', glyph:'runner', note:'Slanted treads drain from top to bottom.'}
    ];
    const gallery = document.getElementById('gallery');
    const largeMeter = document.getElementById('large-meter');
    const range = document.getElementById('stamina-range');
    const output = document.getElementById('stamina-output');
    let selected = 9;

    function meterMarkup(design, className=''){
      return `<span class="meter meter--${design.shape} ${className}" data-meter="${design.shape}" role="img" aria-label="Stamina progress">
        <svg class="glyph" aria-hidden="true"><use href="#glyph-${design.glyph}"></use></svg>
        <span class="track" aria-hidden="true"><span class="fill"></span></span>
      </span>`;
    }

    function selectDesign(index){
      selected = index;
      const design = designs[index];
      document.getElementById('selected-index').textContent = `${String(index+1).padStart(2,'0')} / 10`;
      document.getElementById('selected-name').textContent = design.name;
      document.getElementById('selected-description').textContent = design.note;
      largeMeter.innerHTML = meterMarkup(design);
      gallery.querySelectorAll('.choice').forEach((button,i) => {
        button.setAttribute('aria-pressed',String(i===index));
      });
      setStamina(range.value);
    }

    function setStamina(value){
      const stamina = Math.max(0,Math.min(5,Number(value)));
      const progress = stamina/5;
      range.value = String(stamina);
      output.value = `${stamina.toFixed(1)} s`;
      output.textContent = `${stamina.toFixed(1)} s`;
      document.querySelectorAll('[data-meter]').forEach(meter => {
        meter.style.setProperty('--progress',String(progress));
        meter.classList.toggle('is-empty',stamina===0);
        meter.setAttribute('aria-label',`Stamina progress: ${Math.round(progress*100)} percent`);
      });
      document.querySelectorAll('.preset').forEach(button => {
        button.setAttribute('aria-pressed',String(Number(button.dataset.value)===stamina));
      });
    }

    designs.forEach((design,index) => {
      const button = document.createElement('button');
      button.className = 'choice';
      button.type = 'button';
      button.setAttribute('aria-pressed','false');
      button.setAttribute('aria-label',`${design.name}: ${design.note}`);
      button.innerHTML = `<span class="mini-world"><span class="mini-plumber" aria-hidden="true"></span><span class="mini-dock">${meterMarkup(design)}</span></span>
        <span class="choice-label"><b>${design.name}</b><span>${String(index+1).padStart(2,'0')}</span></span>`;
      button.addEventListener('click',() => selectDesign(index));
      gallery.append(button);
    });

    range.addEventListener('input',() => setStamina(range.value));
    document.querySelectorAll('.preset').forEach(button => {
      button.addEventListener('click',() => setStamina(button.dataset.value));
    });
    selectDesign(selected);
    setStamina(range.value);
  </script>
</body>
</html>
